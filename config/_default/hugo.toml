# -- Site Configuration --
# https://jpanther.github.io/congo/docs/getting-started/

baseURL = "https://eyemask57.github.io/"
theme = "congo"

defaultContentLanguage = "ja"
hasCJKLanguage = true          # CJK言語の文字数カウント・要約を正しく行う
enableEmoji = true             # :emoji: 記法を有効化
timeZone = "Asia/Tokyo"        # `hugo new` で生成される日時のタイムゾーン

enableRobotsTXT = true
summaryLength = 0

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

[privacy]
  [privacy.vimeo]
    enableDNT = true
  [privacy.x]
    enableDNT = true
  [privacy.youTube]
    privacyEnhanced = true

[services]
  [services.x]
    disableInlineCSS = true
